# Scrape the backend services' /metrics endpoints into Prometheus.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: { name: streamingapp, namespace: streamingapp, labels: { release: kube-prometheus-stack } }
spec:
  selector: { matchLabels: { tier: backend } }
  endpoints: [{ port: http, path: /metrics, interval: 30s }]
