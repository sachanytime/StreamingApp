# Sync application secrets from AWS Secrets Manager into a k8s Secret (no plaintext in Git).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata: { name: aws-secrets, namespace: streamingapp }
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
      auth: { jwt: { serviceAccountRef: { name: streamingapp-sa } } }   # IRSA
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: streamingapp-secrets, namespace: streamingapp }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: aws-secrets, kind: SecretStore }
  target: { name: streamingapp-secrets }
  data:
    - { secretKey: MONGO_URI,  remoteRef: { key: streamingapp/prod, property: MONGO_URI } }
    - { secretKey: JWT_SECRET, remoteRef: { key: streamingapp/prod, property: JWT_SECRET } }
