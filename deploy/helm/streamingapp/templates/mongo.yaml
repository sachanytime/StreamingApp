{{- if .Values.mongo.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mongo-pvc }
spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: {{ .Values.mongo.storage }} } } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mongo, labels: { app: mongo } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mongo } }
  template:
    metadata: { labels: { app: mongo } }
    spec:
      containers:
        - name: mongo
          image: {{ .Values.mongo.image }}
          ports: [{ containerPort: 27017 }]
          volumeMounts: [{ name: data, mountPath: /data/db }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: mongo-pvc } }]
---
apiVersion: v1
kind: Service
metadata: { name: mongo }
spec: { selector: { app: mongo }, ports: [{ port: 27017, targetPort: 27017 }] }
{{- end }}
